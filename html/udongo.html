<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pima Udongo - DAES Project</title>
    <link rel="stylesheet" href="../css/elimu.css">
    <link rel="stylesheet" href="../css/style-weather.css"> <!-- Tunatumia css hizi kwa mpangilio -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .soil-container { max-width: 800px; margin: 40px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 15px; }
        .soil-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #273c75; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e2e8f0; outline: none; }
        .btn-test { width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-test:hover { background: #059669; }
        .result-box { display: none; }
        .ph-circle { width: 100px; height: 100px; border-radius: 50%; border: 8px solid #10b981; display: flex; align-items: center; justify-content: center; margin: 20px auto; font-size: 1.5rem; font-weight: 800; color: #273c75; }
        @media (max-width: 768px) { .soil-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- Header imebaki vilevile -->
    <header class="main-header">
        <div class="logo-section">
            <div class="logo-icon"><i class="fas fa-leaf"></i></div>
            <h1 class="logo-text">DIGITAL AGRICULTURE ENHANCEMENT SYSTEM <span>(DAES)</span></h1>
        </div>
        <nav class="nav-links">
        <a href="index.html" class="active">Nyumbani</a>
        <a href="elimu.html">Elimu </a>
        <a href="haliyahewa.html">Hali ya hewa</a>
        <a href="ai.html">AI Msaidizi</a>
        <a href="udongo.html">Udongo</a>
        <a href="soko.html">Soko</a>
        <a href="usajili.html" class="btn-signup">Jisajili</a>
    </nav>
    </header>

    <main class="soil-container">
        <!-- Upande wa Fomu -->
        <section class="soil-card">
            <h3 style="margin-bottom: 15px;"><i class="fas fa-microscope"></i> Upimaji wa Udongo</h3>
            <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 20px;">Chagua sifa za udongo wako kupata makadirio ya pH.</p>
            
            <div class="form-group">
                <label>Rangi ya Udongo:</label>
                <select id="soilColor">
                    <option value="mweusi-kahawia">Mweusi / Kahawia (Nene kwa Mbolea)</option>
                    <option value="mwekundu-manjano">Mwekundu / Manjano (Msingi wa Viazi)</option>
                    <option value="mweupe-kijivu">Mweupe / Kijivu (Nyingi ya Mafasi)</option>
                    <option value="nyeupe-mwekundu">Nyeupe Mwekundu (Mchanganyiko wa Tifutifu na Mfinyanzi)</option>
                    <option value="giza">Giza Sana (Matope Nene kwa Sana)</option>
                    <option value="njano">Njano Tupu (Udongo wa Chemchemi)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Aina ya Udongo:</label>
                <select id="soilType">
                    <option value="tifutifu">Udongo wa Tifutifu (Clay) - Nene na Mnene</option>
                    <option value="mfinyanzi">Udongo wa Mfinyanzi (Loam) - Mchanganyiko Mzuri</option>
                    <option value="kichanga">Udongo wa Kichanga (Sand) - Nyepesi na Kavu</option>
                    <option value="tifutifu-kichanga">Udongo Kati (Clay-Sand Mix)</option>
                    <option value="matope-nene">Matope Nene (Heavy Clay)</option>
                    <option value="udongo-pevu">Udongo Pevu (Organic Rich)</option>
                </select>
            </div>

            <button class="btn-test" onclick="analyzeSoil()">Anza Uchambuzi</button>
        </section>

        <!-- Upande wa Matokeo -->
        <section class="soil-card result-box" id="resultBox">
            <h3 style="text-align: center; color: #273c75;">Matokeo ya pH</h3>
            <div class="ph-circle" id="phValue">7.0</div>
            <div id="soilStatus" style="text-align: center; font-weight: bold; margin-bottom: 15px;">Kawaida (Neutral)</div>
            <hr>
            <div style="margin-top: 15px;">
                <h4 style="color: #10b981;"><i class="fas fa-check-circle"></i> Ushauri:</h4>
                <p id="soilAdvice" style="font-size: 0.9rem; line-height: 1.6; color: #334155;"></p>
            </div>
        </section>
    </main>

    <script>
        function analyzeSoil() {
            const color = document.getElementById('soilColor').value;
            const type = document.getElementById('soilType').value;
            const resultBox = document.getElementById('resultBox');
            const phCircle = document.getElementById('phValue');
            const status = document.getElementById('soilStatus');
            const advice = document.getElementById('soilAdvice');

            resultBox.style.display = "block";
            let ph = 7.0;
            let msg = "";
            let stat = "";
            let borderColor = "#10b981";

            // Mchanganyiko wa Rangi na Aina za Udongo
            const soilData = {
                // MWEUSI / KAHAWIA
                "mweusi-kahawia-tifutifu": {
                    ph: "6.5 - 7.5",
                    status: "Kawaida (Neutral)",
                    advice: "Udongo huu ni bora zaidi! Una nene na mbolea nyingi. Inafaa kwa mahindi, maharage, mbogamboga, pamoja na matunda. Jalieza kwa kawaida lakini kuepuka kupinga kwa wingi.",
                    color: "#10b981"
                },
                "mweusi-kahawia-mfinyanzi": {
                    ph: "7.0 - 8.0",
                    status: "Kawaida (Neutral)",
                    advice: "Udongo mzuri sana kwa kupanda. Mchanganyiko sahihi wa udongo mnene na udongo nyepesi. Inafaa kwa kila aina ya mazao. Jalieza mara 2-3 kwa msimu.",
                    color: "#10b981"
                },
                "mweusi-kahawia-kichanga": {
                    ph: "6.0 - 7.0",
                    status: "Karibu Kawaida",
                    advice: "Udongo nyepesi lakini lenye nene kidogo. Njaa ya maji haraka kwa hiyo jalieza mara nyingi. Inafaa kwa ndani ya mchungwa, nanasi, na chakula cha joto.",
                    color: "#10b981"
                },

                // MWEKUNDU / MANJANO
                "mwekundu-manjano-tifutifu": {
                    ph: "5.0 - 6.0",
                    status: "Tindikali (Acidic)",
                    advice: "Udongo unene na tindikali. Inashauriwa kuongeza chokaa au mbolea za asili kupunguza ukali. Inafaa kwa viazi mviringo, samaki, mananasi, na mbuzi.",
                    color: "#ef4444"
                },
                "mwekundu-manjano-mfinyanzi": {
                    ph: "5.5 - 6.5",
                    status: "Karibu Tindikali",
                    advice: "Udongo wenye asili ya tindikali lakini mchanganyiko mzuri. Ongeza samadi au chokaa. Inafaa kwa mahindi, maharage, na matunda.",
                    color: "#f97316"
                },
                "mwekundu-manjano-kichanga": {
                    ph: "4.8 - 5.8",
                    status: "Tindikali Sana",
                    advice: "Udongo nyepesi na tindikali kwa sana. Taka kuongeza chokaa au mafuta ya samadi. Mazao yanayohusika: nanasi, mananasi, samaki, pamoja na chakula cha joto.",
                    color: "#dc2626"
                },

                // MWEUPE / KIJIVU
                "mweupe-kijivu-tifutifu": {
                    ph: "7.8 - 9.0",
                    status: "Nyongo (Alkaline)",
                    advice: "Udongo na asili ya chumvi au nyongo sana. Ongeza mbolea ya asili na kuepuka kemikali. Inafaa kwa pamba, ngano, na chakula cha baridi.",
                    color: "#3b82f6"
                },
                "mweupe-kijivu-mfinyanzi": {
                    ph: "7.5 - 8.5",
                    status: "Nyongo (Alkaline)",
                    advice: "Udongo wenye asili ya nyongo lakini mchanganyiko sahihi. Ongeza asidi ili kupunguza chumvi. Inafaa kwa ngano, mahindi, pamba.",
                    color: "#3b82f6"
                },
                "mweupe-kijivu-kichanga": {
                    ph: "7.2 - 8.2",
                    status: "Karibu Nyongo",
                    advice: "Udongo nyepesi wenye taka kidogo. Jalieza kwa wingi zaidi. Inafaa kwa chakula cha baridi kama mahindi, ngano.",
                    color: "#0ea5e9"
                },

                // NYEUPE MWEKUNDU - Mchanganyiko
                "nyeupe-mwekundu-tifutifu": {
                    ph: "6.2 - 7.2",
                    status: "Kawaida (Neutral)",
                    advice: "Mchanganyiko vizuri! Udongo wenye rutuba ya kutosha. Inafaa karibu kwa mazao yote. Jalieza kwa kawaida.",
                    color: "#10b981"
                },
                "nyeupe-mwekundu-mfinyanzi": {
                    ph: "6.5 - 7.5",
                    status: "Kawaida (Neutral)",
                    advice: "Mchanganyiko bora kwa kupanda! Inafaa kwa mahindi, maharage, mbogamboga, matunda. Pata mavuno mazuri.",
                    color: "#10b981"
                },
                "nyeupe-mwekundu-kichanga": {
                    ph: "5.8 - 7.0",
                    status: "Karibu Kawaida",
                    advice: "Udongo nyepesi lakini wenye jalieza. Jalieza mara nyingi. Inafaa kwa chakula kote.",
                    color: "#10b981"
                },

                // GIZA SANA - Matope Nene
                "giza-tifutifu": {
                    ph: "6.0 - 7.0",
                    status: "Kawaida",
                    advice: "Matope nene sana kwa mbolea nyingi. Inashauriwa kukamatia ili kuhitaji maji kidogo. Inafaa kwa mahindi, maharage, mbogamboga.",
                    color: "#10b981"
                },
                "giza-mfinyanzi": {
                    ph: "6.5 - 7.5",
                    status: "Kawaida",
                    advice: "Matope nzuri kwa jalieza na mbolea. Mchanganyiko mzuri. Inafaa kwa yote yote.",
                    color: "#10b981"
                },
                "giza-kichanga": {
                    ph: "5.5 - 6.5",
                    status: "Karibu Kawaida",
                    advice: "Matope lakini nyepesi kidogo. Jalieza haraka. Ongeza mbolea ya asili.",
                    color: "#10b981"
                },
                "giza-tifutifu-kichanga": {
                    ph: "6.2 - 7.2",
                    status: "Kawaida",
                    advice: "Mchanganyiko vizuri! Matope nene lakini una urefu. Inafaa mazao yote.",
                    color: "#10b981"
                },
                "giza-matope-nene": {
                    ph: "6.8 - 7.8",
                    status: "Kawaida",
                    advice: "Matope sana! Kunyongwa maji haraka. Jalieza kwa ujinga. Inafaa kwa mahindi, maharage nne.",
                    color: "#10b981"
                },
                "giza-udongo-pevu": {
                    ph: "6.5 - 7.5",
                    status: "Kawaida Bora",
                    advice: "Kuzuri sana! Matope lenye mbolea nyingi. Inafaa kwa yote yote. Jalieza kwa kawaida.",
                    color: "#059669"
                },

                // NJANO TUPU - Udongo wa Chemchemi
                "njano-tifutifu": {
                    ph: "5.2 - 6.2",
                    status: "Tindikali",
                    advice: "Udongo wenye historia ya maji ya mvua. Tindikali na njaa ya mbolea. Ongeza samadi nyingi. Inafaa kwa samaki, viazi mviringo.",
                    color: "#ef4444"
                },
                "njano-mfinyanzi": {
                    ph: "5.8 - 6.8",
                    status: "Karibu Kawaida",
                    advice: "Udongo wa maji ya mvua. Ongeza samadi. Inafaa kwa mahindi na other crops.",
                    color: "#f97316"
                },
                "njano-kichanga": {
                    ph: "5.0 - 6.0",
                    status: "Tindikali",
                    advice: "Udongo nyepesi na tindikali. Jalieza mara nyingi. Ongeza samadi. Inafaa chakula cha joto.",
                    color: "#dc2626"
                }
            };

            // Kupata data
            const key = `${color}-${type}`;
            const data = soilData[key];

            if (data) {
                ph = data.ph;
                stat = data.status;
                msg = data.advice;
                borderColor = data.color;
            } else {
                // Default kama hakuna match
                ph = "6.5 - 7.5";
                stat = "Kawaida (Neutral)";
                msg = "Tafadhali jaribu mchanganyiko tofauti wa rangi na aina.";
                borderColor = "#10b981";
            }

            phCircle.style.borderColor = borderColor;
            phCircle.innerText = ph;
            status.innerText = stat;
            advice.innerText = msg;
        }
    </script>

    <footer class="main-footer">
        <p>&copy; 2026 DAES Project. Haki zote zimehifadhiwa.</p>
    </footer>
</body>
</html>
